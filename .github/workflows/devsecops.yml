name: Esteira DevSecOps Hackers do Bem

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop ]

# Permite que os relatórios e varreduras gravem dados no fluxo do GitHub
permissions:
  contents: read
  issues: write
  statuses: write

jobs:
  # --- ETAPA 3: COMPILAÇÃO E VERIFICAÇÃO INICIAL ---
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3

      - name: Configurar o Python no ambiente
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validar instalação de dependências (Build)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  # --- ETAPA 4: ANÁLISE ESTÁTICA DE SEGURANÇA (SAST) ---
  security_sast:
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Executar o Bandit (Análise Estática do Código)
        run: |
          pip install bandit
          bandit -r todo_project/ -f txt -o relatorio-bandit.txt || true

      - name: Executar Análise de Vulnerabilidades em Dependências (Pip-Audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -o relatorio-dependencias.txt || true

      - name: Salvar Relatórios de Segurança como Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-seguranca-sast
          path: |
            relatorio-bandit.txt
            relatorio-dependencias.txt

  # --- ETAPA 5: DEPLOY EM STAGING E ANÁLISE DINÂMICA (DAST) ---
  deploy_staging_and_dast:
    needs: security_sast
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v3

      - name: Construir a Imagem Docker da Aplicação
        run: |
          docker build -t meu-gerenciador-tarefas:staging .

      - name: Subir Aplicação em Staging (CD Efêmero)
        run: |
          docker run -d -p 5000:5000 --name app_staging -e FLASK_SECRET_KEY="${{ secrets.FLASK_SECRET_KEY }}" meu-gerenciador-tarefas:staging
          # Aguarda 5 segundos para o Flask inicializar completamente
          sleep 5

      - name: Executar OWASP ZAP Baseline Scan (DAST)
        uses: zaproxy/action-baseline@v0.13.0
        continue-on-error: true         # <--- SOLUÇÃO: Impede que a falha interna de API do ZAP quebre o pipeline
        with:
          target: 'http://172.17.0.1:5000/'
          fail_action: false                # Evita travar a esteira com alertas dinâmicos
          token: ${{ secrets.GITHUB_TOKEN }} # Mantém a comunicação interna com o repositório
          artifact_name: ''                 # Desativa o upload nativo problemático do ZAP

      # --- SALVAMENTO SEGURO DOS ARTEFATOS ---
      - name: Salvar Relatórios do DAST (OWASP ZAP) como Artefatos
        uses: actions/upload-artifact@v4
        if: always() # Garante que os relatórios sejam salvos mesmo se o passo anterior falhar
        with:
          name: relatorio-seguranca-dast
          path: |
            report_html.html
            report_md.md